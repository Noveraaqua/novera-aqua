<body>
<div class="wrap">
  <header class="hd" id="hdr"></header>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="sheet" hidden><div class="bd" data-act="sheet-close"></div><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var pad=function(n){return String(n).padStart(2,'0');};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var today=function(){return ymd(new Date());};
var nowHM=function(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
var parseD=function(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
var addDays=function(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);};
var diffDays=function(a,b){return Math.round((parseD(a)-parseD(b))/864e5);};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var fmtD=function(s){var d=parseD(s);return d.getDate()+' '+MON[d.getMonth()];};
var ago=function(n){return addDays(today(),-n);};
var fmtN=function(n){return Number(n).toLocaleString('en-US');};
var r2=function(x){return Math.round(x*100)/100;};
var rd=function(x){return +Number(x).toPrecision(4);};
var trimN=function(x,dp){return String(+Number(x).toFixed(dp));};
/* feed amounts run from fractions of a milligram up to grams */
var fmtMg=function(mg){
  if(!(mg>0))return '0 mg';
  if(mg>=1000)return trimN(mg/1000,2)+' g';
  if(mg>=100)return trimN(mg,0)+' mg';
  if(mg>=10)return trimN(mg,1)+' mg';
  if(mg>=1)return trimN(mg,2)+' mg';
  return String(+mg.toPrecision(3))+' mg';
};
var fmtG=function(g){return fmtMg(g*1000);};
var fmtPct=function(x){return trimN(x,4)+'%';};
var seqOf=function(id){return +String(id).slice(1)||0;};
var byDateDesc=function(a,b){return b.date.localeCompare(a.date)||seqOf(b.id)-seqOf(a.id);};

/* ---------- reference data ---------- */
var PARAMS=[
  {k:'temp',label:'Temp',unit:'°C',dp:1,hint:''},
  {k:'ph',label:'pH',unit:'',dp:2,hint:'Must stay stable'},
  {k:'gh',label:'GH',unit:'°dGH',dp:1,hint:''},
  {k:'kh',label:'KH',unit:'°dKH',dp:1,hint:''},
  {k:'tds',label:'TDS',unit:'ppm',dp:0,hint:''},
  {k:'nh3',label:'NH₃/NH₄',unit:'mg/L',dp:2,hint:'Ideal is 0'},
  {k:'no2',label:'NO₂',unit:'mg/L',dp:2,hint:'Ideal is 0'},
  {k:'no3',label:'NO₃',unit:'mg/L',dp:0,hint:'0 is best, 10–20 is fine'},
  {k:'do',label:'DO',unit:'mg/L',dp:1,open:true,hint:'Dissolved oxygen, above 6'}
];
/* optimal = NOVERA AQUA targets; limits are starting values the farm can edit */
var DEF_RANGES={
  temp:{omin:25,omax:29,lmin:22,lmax:31},
  ph:{omin:6.5,omax:8,lmin:6,lmax:8.5},
  gh:{omin:6,omax:13,lmin:4,lmax:16},
  kh:{omin:3,omax:4,lmin:2,lmax:6},
  tds:{omin:170,omax:210,lmin:120,lmax:300},
  nh3:{omin:0,omax:0,lmin:0,lmax:0.25},
  no2:{omin:0,omax:0,lmin:0,lmax:0.25},
  no3:{omin:0,omax:20,lmin:0,lmax:40},
  do:{omin:6,omax:99,lmin:4,lmax:99}
};
var STAGES=['Fry/juvenile','Grow-out','Breeders','Holding'];
var CAUSES=['Molting','Water quality','Temperature','Acclimation / transport','Disease','Unknown','Other'];
var MORT_ALERT=0.05;
var CHECK_MS=2*3600*1000;
var LEVEL=['Within configured range','Warning','Danger'];
var ICONS={
  overview:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  stock:'<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/>',
  mortality:'<path d="M3 7l6 6 4-4 8 8"/><path d="M21 11v6h-6"/>',
  water:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  feeding:'<path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1.5 1-2 1-3M13 7c0-1.5 1-2 1-3"/>',
  schedule:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>'
};
var TABS=[['overview','Overview'],['stock','Stock'],['mortality','Deaths'],['water','Water'],['feeding','Feeding'],['schedule','Schedule']];

/* ---------- state ---------- */
var KEY='noveraAqua.v2';
var S=null, CNT={}, memOnly=false;
var UI={tab:'overview',wTank:null,wParam:'ph',wOnly:false,sFilter:'all',mFilter:'all',fFilter:'all',weekStart:null};
var nid=function(p){S.seq=(S.seq||0)+1;return p+S.seq;};
var clone=function(o){return JSON.parse(JSON.stringify(o));};
function defSettings(){return {ranges:clone(DEF_RANGES),shrimpMg:75,feedA:0.03,feedB:0.05,feedOpt:'a',feedings:2,adjust:true,phSwing:0.5};}
function mergeSettings(s){
  var d=defSettings();s=s||{};
  Object.keys(d.ranges).forEach(function(k){d.ranges[k]=Object.assign(d.ranges[k],(s.ranges||{})[k]||{});});
  if(s.shrimpMg>0)d.shrimpMg=+s.shrimpMg;
  if(s.feedA>0)d.feedA=+s.feedA;
  if(s.feedB>0)d.feedB=+s.feedB;
  if(s.feedOpt==='b')d.feedOpt='b';
  if(s.feedings>=1&&s.feedings<=6)d.feedings=s.feedings;
  if(s.adjust===false)d.adjust=false;
  if(s.phSwing>0)d.phSwing=+s.phSwing;
  d.worldStaleDays=Number.isInteger(s.worldStaleDays)&&s.worldStaleDays>=1&&s.worldStaleDays<=365?s.worldStaleDays:7;
  d.worldReduced=s.worldReduced===true;
  d.worldView=s.worldView==='illustrated'?'illustrated':'compact';
  return d;
}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&Array.isArray(o.tanks))return o;}}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){memOnly=true;}}
function emptyState(){return {v:2,seq:0,meta:{sample:false,schema:2},tanks:[],ledger:[],water:[],feed:[],settings:defSettings(),officers:[],roster:{},tasks:[],lockedWeeks:{}};}

function counts(){
  var c={};S.tanks.forEach(function(t){c[t.id]=0;});
  var L=S.ledger.slice().sort(function(a,b){return a.date.localeCompare(b.date)||seqOf(a.id)-seqOf(b.id);});
  L.forEach(function(e){var q=+e.qty||0;
    if(e.kind==='add')c[e.tank]=(c[e.tank]||0)+q;
    else if(e.kind==='sell'||e.kind==='death')c[e.tank]=Math.max(0,(c[e.tank]||0)-q);
    else if(e.kind==='move'){c[e.tank]=Math.max(0,(c[e.tank]||0)-q);c[e.to]=(c[e.to]||0)+q;}
    else if(e.kind==='count')c[e.tank]=q;});
  return c;
}
var refreshCounts=function(){CNT=counts();};
var cnt=function(id){return CNT[id]||0;};
var tankOf=function(id){return S.tanks.filter(function(t){return t.id===id;})[0];};
var tankName=function(id){var t=tankOf(id);return t?t.name:'?';};
var activeTanks=function(){return S.tanks.filter(function(t){return t.active!==false;}).sort(function(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true});});};
var deaths=function(tank,from,to){return S.ledger.reduce(function(a,e){return a+((e.kind==='death'&&(!tank||e.tank===tank)&&e.date>=from&&e.date<=to)?(+e.qty||0):0);},0);};

/* ---------- water judging ---------- */
var P=function(k){return PARAMS.filter(function(p){return p.k===k;})[0];};
function judge(k,v){
  if(!hasReading(v))return null;
  var r=S.settings.ranges[k],op=P(k).open;
  if(v<r.lmin)return {lvl:2,dir:'low'};
  if(!op&&v>r.lmax)return {lvl:2,dir:'high'};
  if(v<r.omin)return {lvl:1,dir:'low'};
  if(!op&&v>r.omax)return {lvl:1,dir:'high'};
  return {lvl:0,dir:''};
}
function hasReading(v){return (typeof v==='number'||typeof v==='string'&&v.trim()!=='')&&Number.isFinite(Number(v));}
var fmtV=function(p,v){return !hasReading(v)?'—':String(+Number(v).toFixed(p.dp));};
var rangeTxt=function(k){
  var r=S.settings.ranges[k],p=P(k),u=p.unit?' '+p.unit:'';
  if(p.open)return '≥ '+fmtV(p,r.omin)+u;
  if(r.omin===r.omax)return fmtV(p,r.omin)+u;
  return fmtV(p,r.omin)+'–'+fmtV(p,r.omax)+u;
};
function latestWater(id){var best=null;S.water.forEach(function(w){if(w.tank!==id)return;if(!best||w.date>best.date||(w.date===best.date&&((w.time||'')>(best.time||'')||((w.time||'')===(best.time||'')&&seqOf(w.id)>seqOf(best.id)))))best=w;});return best;}
/* pH counts as stable when readings over the last 7 days stay within the allowed swing */
function phSwing(id){
  var from=addDays(today(),-6),v=[];
  S.water.forEach(function(w){if(w.tank===id&&w.date>=from&&w.date<=today()&&hasReading(w.ph))v.push(+w.ph);});
  return v.length<2?0:Math.max.apply(null,v)-Math.min.apply(null,v);
}
function tankWater(id){
  var w=latestWater(id),age=w&&typeof w.date==='string'?diffDays(today(),w.date):null,limit=S.settings.worldStaleDays||7;
  var invalidDate=!!w&&(typeof w.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(w.date)||!Number.isFinite(age)||age<0||ymd(parseD(w.date))!==w.date),overdue=!!w&&(invalidDate||age>=limit),sw=phSwing(id);
  var items=PARAMS.map(function(p){var v=w?w[p.k]:null,j=judge(p.k,v);
    if(p.k==='ph'&&j&&sw>S.settings.phSwing+1e-9)j={lvl:Math.max(j.lvl,1),dir:j.dir,unstable:true,swing:sw};
    return {p:p,v:v,j:j,overdue:overdue};
  });
  var measured=items.filter(function(i){return !!i.j;}),missing=items.filter(function(i){return i.p.k!=='do'&&!i.j;});
  var lvl=measured.length?Math.max.apply(null,measured.map(function(i){return i.j.lvl;})):null;
  var freshness=!measured.length?'missing':missing.length?'partial':overdue?'overdue':'current';
  return {w:w,items:items,lvl:lvl,condition:lvl===null?'unknown':lvl===2?'danger':lvl===1?'warning':'within',age:age,
    freshness:freshness,overdue:overdue,invalidDate:invalidDate,missing:missing,measured:measured.length,
    outOfRange:items.some(function(i){return i.j&&!!i.j.dir;}),needsAttention:lvl>0||freshness!=='current'};
}
function conditionText(s){
 if(s.lvl===null)return 'Not assessed';
 if(s.lvl>0)return LEVEL[s.lvl]+(s.overdue?' when last tested':'');
 if(s.overdue)return 'Within range when last tested'+(s.freshness==='partial'?' · recorded values only':'');
 return s.freshness==='partial'?'Recorded values within range':'Within configured range';
}
function freshnessText(s){return {current:'Current',overdue:'Overdue',missing:'Missing',partial:'Partially recorded'}[s.freshness]+(s.overdue&&s.freshness!=='overdue'?' · Overdue':'');}
function readingCause(i){
 var value=i.p.label+' '+fmtV(i.p,i.v)+(i.p.unit?' '+i.p.unit:' (unitless)'),parts=[];
 if(i.j.dir)parts.push(i.j.dir+' — '+LEVEL[i.j.lvl]);
 if(i.j.unstable)parts.push('unstable — 7-day pH swing '+r2(i.j.swing)+' exceeds configured '+S.settings.phSwing+' pH units');
 return value+': '+parts.join('; ')+(i.overdue?' (last tested)':'');
}
function waterReasons(s){
 var reasons=s.items.filter(function(i){return i.j&&i.j.lvl>0;}).map(readingCause);
 if(s.freshness==='missing')reasons.push('Missing: no valid water readings recorded.');
 else if(s.missing.length)reasons.push('Partially recorded: missing '+s.missing.map(function(i){return i.p.label;}).join(', ')+'. DO remains optional.');
 if(s.invalidDate)reasons.push('Overdue: measurement date is invalid or in the future; confirm the date and retest.');
 else if(s.overdue)reasons.push('Overdue: last tested '+s.age+' days ago; configured limit '+(S.settings.worldStaleDays||7)+' days.');
 return reasons;
}
function waterBadges(s){return '<span class="water-status-pair"><span class="pill '+(s.lvl===null||s.lvl===0&&s.freshness!=='current'?'none':'l'+s.lvl)+'">Water: '+esc(conditionText(s))+'</span><span class="pill none">Freshness: '+esc(freshnessText(s))+'</span></span>';}
function waterSummary(){
 var states=activeTanks().map(function(t){return tankWater(t.id);}),n=function(fn){return states.filter(fn).length;};
 return {total:states.length,outOfRange:n(function(s){return s.outOfRange;}),warning:n(function(s){return s.lvl===1;}),danger:n(function(s){return s.lvl===2;}),
 current:n(function(s){return s.freshness==='current';}),overdue:n(function(s){return s.overdue;}),missing:n(function(s){return s.freshness==='missing';}),partial:n(function(s){return s.freshness==='partial';})};
}
function waterSummaryHTML(){var c=waterSummary();return '<div class="water-summary"><p><b>'+c.outOfRange+' of '+c.total+' tanks have out-of-range recorded values.</b> Water condition: '+c.warning+' warning · '+c.danger+' danger.</p><p class="sub">Freshness: '+c.current+' current · '+c.overdue+' overdue · '+c.missing+' missing · '+c.partial+' partially recorded. Overdue can overlap incomplete records; age never counts as out of range. Warnings also include configured pH-swing alerts.</p></div>';}

/* ---------- feeding estimate ---------- */
/* biomass = shrimp × reference weight (75 mg unless the tank has its own); ration = biomass × selected % per day */
function tankFeedOpt(t){return t.feedOpt==='b'?'b':t.feedOpt==='a'?'a':S.settings.feedOpt==='b'?'b':'a';}
function feedRateControl(t){var opt=tankFeedOpt(t);return '<div class="tank-rate"><span class="sub">Body weight per day</span><div class="seg" role="group" aria-label="'+esc(t.name)+' feeding rate">'+['a','b'].map(function(o){return '<button type="button" data-act="feed-opt" data-tank="'+t.id+'" data-opt="'+o+'" aria-pressed="'+(opt===o)+'">'+fmtPct(o==='a'?S.settings.feedA:S.settings.feedB)+'</button>';}).join('')+'</div></div>';}
function feedPlan(t){
  var st=S.settings,n=cnt(t.id),wt=t.wt>0?+t.wt:st.shrimpMg,bio=n*wt/1000,f=1,notes=[];
  if(st.adjust){
    var w=latestWater(t.id);
    if(w&&diffDays(today(),w.date)<=7){
      var tj=judge('temp',w.temp);
      if(tj&&tj.lvl>=1){f*=0.8;notes.push('−20% '+(tj.dir==='high'?'warm':'cool')+' water');}
      var a=Math.max((judge('nh3',w.nh3)||{lvl:0}).lvl,(judge('no2',w.no2)||{lvl:0}).lvl);
      if(a>=1){f*=0.5;notes.push('−50% ammonia or nitrite above 0');}
    }
  }
  var pct=tankFeedOpt(t)==='b'?st.feedB:st.feedA,day=bio*pct/100*f;
  return {n:n,wt:wt,bio:bio,pct:pct,f:f,notes:notes,day:day,per:day/st.feedings,dayA:bio*st.feedA/100*f,dayB:bio*st.feedB/100*f};
}
var fedOn=function(id,date){return S.feed.filter(function(e){return e.tank===id&&e.date===date;});};
var sumG=function(arr){return arr.reduce(function(a,e){return a+(+e.g||0);},0);};
var feedKey=function(e){return e.date+' '+(e.time||'00:00');};
function entryMs(e){var d=parseD(e.date),hm=String(e.time||'00:00').split(':');d.setHours(+hm[0]||0,+hm[1]||0,0,0);return +d;}
/* feedings still waiting for the "eaten within 2 hours?" answer */
function pendingChecks(){
  var now=Date.now(),from=addDays(today(),-1),out=[];
  S.feed.forEach(function(e){if(e.res!=='pending'||e.date<from)return;var due=entryMs(e)+CHECK_MS;out.push({e:e,due:due,overdue:now>=due});});
  return out;
}
function resPill(e){
  if(e.res==='eaten')return '<span class="pill l0">Eaten within 2 h</span>';
  if(e.res==='left')return '<span class="pill l1">Left after 2 h</span>';
  if(e.res==='pending'){
    var due=entryMs(e)+CHECK_MS;
    if(Date.now()>=due)return '<span class="pill l1">Check due</span>';

/* ---------- alerts ---------- */
function alerts(){
  var out=[],T=activeTanks(),t0=today(),notFed=[];
  T.forEach(function(t){
    var s=tankWater(t.id);
    var causes=s.items.filter(function(i){return i.j&&i.j.lvl>0;});
    waterReasons(s).forEach(function(reason,n){out.push({lvl:n<causes.length?causes[n].j.lvl:0,k:3,t:t.name,tx:reason,sub:''});});
    var d7=deaths(t.id,addDays(t0,-6),t0),n=cnt(t.id),rate=d7/((n+d7)||1);
    if(d7>=3&&rate>=MORT_ALERT)out.push({lvl:rate>=0.1?2:1,k:1,t:t.name,tx:d7+' deaths in 7 days ('+(rate*100).toFixed(1)+'% of stock)',sub:''});
    if(n>0&&!fedOn(t.id,t0).length)notFed.push(t.name);
    var last=null;
    S.feed.forEach(function(e){if(e.tank!==t.id||(e.res!=='eaten'&&e.res!=='left'))return;if(!last||feedKey(e)>feedKey(last))last=e;});
    if(last&&last.res==='left'&&last.date>=addDays(t0,-1))out.push({lvl:1,k:2,t:t.name,tx:'Food left after 2 hours ('+fmtD(last.date)+')',sub:'Remove leftovers and cut the next ration.'});
  });
  var due=[];pendingChecks().forEach(function(x){if(x.overdue){var nm=tankName(x.e.tank);if(due.indexOf(nm)<0)due.push(nm);}});
  if(due.length)out.push({lvl:0,k:2,t:'Feed',tx:'2-hour check due: '+due.join(', '),sub:'Mark each feeding as eaten or left over.'});
  if(notFed.length)out.push({lvl:0,k:2,t:'Feed',tx:'Not fed yet today: '+notFed.join(', '),sub:''});
  return out.sort(function(a,b){return b.lvl-a.lvl||a.k-b.k;});
}

/* ---------- charts ---------- */
function niceScale(lo,hi,n){
  if(hi<=lo)hi=lo+1;
  var raw=(hi-lo)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/mag;
  var step=(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*mag;
  var a=Math.floor(lo/step+1e-9)*step,b=Math.ceil(hi/step-1e-9)*step,ticks=[];
  for(var v=a;v<=b+step/2;v+=step)ticks.push(+v.toFixed(6));
  return {min:a,max:b,ticks:ticks,step:step};
}
function decimals(x){var s=String(+x.toFixed(6)).split('.')[1];return s?s.length:0;}
function waterChart(tid,k){
  var p=P(k),r=S.settings.ranges[k],end=today(),start=addDays(end,-29);
  var pts=S.water.filter(function(w){return w.tank===tid&&hasReading(w[k])&&w.date>=start&&w.date<=end;}).sort(function(a,b){return a.date.localeCompare(b.date)||seqOf(a.id)-seqOf(b.id);});
  if(!pts.length)return '<p class="empty">No '+esc(p.label)+' readings for this tank in the last 30 days.</p>';
  var vals=pts.map(function(x){return +x[k];});
  var lo=Math.min.apply(null,vals.concat([r.omin])),hi=Math.max.apply(null,vals.concat([p.open?r.omin:r.omax]));
  var padv=(hi-lo)*0.14||1,ymin=lo-padv;if(lo>=0&&ymin<0)ymin=0;
  var sc=niceScale(ymin,hi+padv,4),dp=Math.min(3,Math.max(p.dp,decimals(sc.step)));
  var W=360,H=190,L=38,R=16,T=16,B=26;
  var x=function(d){return L+diffDays(d,start)/29*(W-L-R);};
  var y=function(v){return T+(1-(v-sc.min)/(sc.max-sc.min))*(H-T-B);};
  var g='';
  sc.ticks.forEach(function(t){g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t).toFixed(1)+'" y2="'+y(t).toFixed(1)+'"/><text x="'+(L-6)+'" y="'+(y(t)+3.5).toFixed(1)+'" text-anchor="end">'+String(+t.toFixed(dp))+'</text>';});
  var bt=y(p.open?sc.max:Math.min(r.omax,sc.max)),bb=y(Math.max(r.omin,sc.min));
  var band='<rect class="band" x="'+L+'" y="'+bt.toFixed(1)+'" width="'+(W-L-R)+'" height="'+Math.max(2,bb-bt).toFixed(1)+'"/>';
  var xl='';[[0,'start'],[10,'middle'],[20,'middle'],[29,'end']].forEach(function(o){var d=addDays(start,o[0]);
    xl+='<text x="'+x(d).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+o[1]+'"'+(o[0]===29?' class="today"':'')+'>'+(o[0]===29?'Today':fmtD(d))+'</text>';});
  var line=pts.map(function(q,i){return (i?'L':'M')+x(q.date).toFixed(1)+' '+y(+q[k]).toFixed(1);}).join(' ');
  var dots=pts.map(function(q,i){var j=judge(k,+q[k]),last=i===pts.length-1;
    return '<circle class="pt p'+(j?j.lvl:0)+'" cx="'+x(q.date).toFixed(1)+'" cy="'+y(+q[k]).toFixed(1)+'" r="'+(last?5:3.5)+'"><title>'+esc(fmtD(q.date)+': '+fmtV(p,q[k])+(p.unit?' '+p.unit:''))+'</title></circle>';}).join('');
  var lp=pts[pts.length-1],ly=y(+lp[k]),lab='<text class="val" x="'+x(lp.date).toFixed(1)+'" y="'+(ly-10<T?ly+18:ly-10).toFixed(1)+'" text-anchor="end">'+fmtV(p,lp[k])+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(p.label+' for '+tankName(tid)+', last 30 days, latest '+fmtV(p,lp[k])+' on '+fmtD(lp.date))+'">'+g+band+xl+'<path class="ln" d="'+line+'"/>'+dots+lab+'</svg>';
}
function mortChart(){
  var t0=today(),days=[];for(var i=13;i>=0;i--)days.push(addDays(t0,-i));
  var vals=days.map(function(d){return deaths(null,d,d);});
  var sc=niceScale(0,Math.max.apply(null,vals.concat([4])),4);
  var W=360,H=160,L=28,R=6,T=16,B=24,slot=(W-L-R)/14,bw=Math.min(16,slot*0.62);
  var y=function(v){return T+(1-v/sc.max)*(H-T-B);};
  var g='';sc.ticks.forEach(function(t){g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t).toFixed(1)+'" y2="'+y(t).toFixed(1)+'"/><text x="'+(L-6)+'" y="'+(y(t)+3.5).toFixed(1)+'" text-anchor="end">'+t+'</text>';});
  var bars='';days.forEach(function(d,i){var cx=L+slot*i+slot/2,v=vals[i];
    if(v>0){var top=y(v),h=y(0)-top;bars+='<path class="barr" d="M'+(cx-bw/2).toFixed(1)+' '+y(0).toFixed(1)+'V'+(top+Math.min(4,h)).toFixed(1)+'a4 4 0 0 1 4 -4h'+(bw-8).toFixed(1)+'a4 4 0 0 1 4 4V'+y(0).toFixed(1)+'z"><title>'+esc(fmtD(d)+': '+v+' deaths')+'</title></path><text class="val" x="'+cx.toFixed(1)+'" y="'+(top-4).toFixed(1)+'" text-anchor="middle">'+v+'</text>';}
    bars+='<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle"'+(i===13?' class="today"':'')+'>'+parseD(d).getDate()+'</text>';});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Deaths per day, last 14 days, total '+vals.reduce(function(a,b){return a+b;},0)+'">'+g+bars+'</svg>';
}

   +(rows.length?rows.map(function(r){var c=r.x7>=3&&r.r7>=MORT_ALERT?(r.r7>=0.1?' l2':' l1'):'';return '<tr><td><b>'+esc(r.t.name)+'</b> <span class="sub">'+esc(r.t.line)+'</span></td><td class="r'+c+'">'+r.x7+'</td><td class="r'+c+'">'+(r.r7*100).toFixed(1)+'%'+(c?' ▲':'')+'</td><td class="r">'+r.x30+'</td><td class="r">'+(r.r30*100).toFixed(1)+'%</td></tr>';}).join(''):'<tr><td colspan="5" class="empty">No tanks.</td></tr>')
   +'</tbody></table></div></section>';
  if(cl.length)h+='<section><h2>Causes · 30 days</h2><div class="card causes">'+cl.map(function(c){return '<div class="cause"><span>'+esc(c[0])+'</span><div class="bar"><i style="width:'+(c[1]/cm*100).toFixed(1)+'%"></i></div><b class="num">'+c[1]+'</b></div>';}).join('')+'</div></section>';
  h+='<section><div class="sec-h"><h2>Death log</h2><div class="fld" style="margin:0"><select data-ui="mFilter" aria-label="Filter by tank"><option value="all">All tanks</option>'+S.tanks.map(function(t){return '<option value="'+t.id+'"'+(UI.mFilter===t.id?' selected':'')+'>'+esc(t.name)+'</option>';}).join('')+'</select></div></div>'

function removeTankData(id){
  if(!tankOf(id))return;
  S.ledger=S.ledger.reduce(function(out,e){
    if(e.kind==='move'&&(e.tank===id||e.to===id)){
      if(e.tank===id&&e.to===id)return out;
      var kept=Object.assign({},e,{tank:e.tank===id?e.to:e.tank,kind:e.tank===id?'add':'sell'});
      delete kept.to;kept.note='Transfer involving a deleted tank';out.push(kept);
    }else if(e.tank!==id&&e.to!==id)out.push(e);
    return out;
  },[]);
  S.water=S.water.filter(function(e){return e.tank!==id;});
  S.feed=S.feed.filter(function(e){return e.tank!==id;});
  S.tanks=S.tanks.filter(function(t){return t.id!==id;});
  ['worldTank','wTank'].forEach(function(k){if(UI[k]===id)UI[k]=null;});
  ['sFilter','mFilter','fFilter'].forEach(function(k){if(UI[k]===id)UI[k]='all';});
  refreshCounts();
}

    'Delete tank and data',function(fd){
      if(val(fd,'confirmation')!=='DELETE')return 'Type DELETE exactly to confirm.';

function worldDetail(t,h){var p=worldPopulation(t),w=h.tw.w,history=S.water.filter(function(x){return x.tank===t.id;}).sort(byDateDesc).slice(0,5);
 return '<article class="card tw-detail" id="tw-detail" tabindex="-1"><p class="eyebrow">Tank details</p><h2>'+esc(t.name)+'</h2><p class="sub">'+esc(t.stage||'Stage not recorded')+' · '+(t.vol?esc(t.vol)+' L':'Volume not recorded')+' · Dimensions not recorded</p>'+(S.settings.worldView==='illustrated'?'<div class="tw-scene">'+worldAquarium(t,true)+'</div>':'')+'<strong class="tw-count">'+worldPopText(p)+'</strong><div class="tw-variants">'+worldVariants(p)+'</div><div class="actions"><button class="btn" data-act="water-add" data-tank="'+esc(t.id)+'">Log water test</button><button class="btn ghost" data-act="stock" data-kind="count" data-tank="'+esc(t.id)+'">Update stock</button></div><details class="world-settings"><summary>Tank settings &amp; appearance</summary><div class="actions"><button class="btn ghost" data-act="tank-edit" data-id="'+esc(t.id)+'">Manage tank</button><button class="btn ghost" data-act="world-variants" data-id="'+esc(t.id)+'">Variant counts</button></div><label class="tw-toolbar">Visual environment <select data-world-decor="'+esc(t.id)+'">'+[['planted','Moss & rocks'],['wood','Driftwood garden'],['minimal','Breeding tank'],['sand','Sand garden']].map(function(a){return '<option value="'+a[0]+'" '+((t.worldDecor||'planted')===a[0]?'selected':'')+'>'+a[1]+'</option>';}).join('')+'</select><small>Appearance only; does not change husbandry records.</small></label></details><h3>Monitoring</h3>'+waterBadges(h.tw)+'<p class="sub">'+(w&&w.entryMethod==='photo-ocr'?esc(waterSource(w)):(S.meta.sample?'Simulated demonstration data':'Cached, manually recorded measurements'))+' · '+esc(worldStamp(w))+'</p>'+(h.reasons.length?'<ul class="tw-warnings">'+h.reasons.map(function(r){return '<li>'+esc(r)+'</li>';}).join('')+'</ul>':'<p>All required readings are within configured targets and freshness limits.</p>')+'<div class="tw-parameters">'+orderedWaterItems(h.tw).map(function(i){var q=i.p,v=w&&w[q.k];return '<div><span class="sub">'+q.label+'</span><strong>'+fmtV(q,v)+' <small>'+q.unit+'</small></strong><span>'+(i&&i.j?(i.j.lvl>0?esc(readingCause(i)):(h.tw.overdue?'Within range when last tested':'Within configured range')):'Missing — not recorded')+'</span><small>Target '+rangeTxt(q.k)+'</small></div>';}).join('')+'</div><h3>30-day history</h3><label>Parameter <select data-ui="worldParam">'+PARAMS.map(function(q){return '<option value="'+q.k+'" '+((UI.worldParam||'ph')===q.k?'selected':'')+'>'+q.label+'</option>';}).join('')+'</select></label>'+waterChart(t.id,UI.worldParam||'ph')+'<h3>Recent tests</h3>'+(history.length?history.map(function(x){return '<p class="sub">'+esc(worldStamp(x))+' · '+esc(waterSource(x))+' · '+esc(x.note||'Water test')+'</p>';}).join(''):'<p class="sub">No tests saved.</p>')+'<h3>Active husbandry alerts</h3>'+worldActiveAlerts(t)+'<h3>Water changes</h3><p class="sub">The existing app has no completed water-change log. Scheduled tasks are available in Schedule; they are not proof of a water change.</p><button class="btn ghost sm" data-act="tab" data-tab="schedule">Open schedule</button></article>';
}

function worldActiveAlerts(t){var messages=alerts().filter(function(a){return a.t===t.name;}).map(function(a){return a.tx+(a.sub?' — '+a.sub:'');});if(cnt(t.id)>0&&!fedOn(t.id,today()).length)messages.push('No feeding recorded today.');if(pendingChecks().some(function(x){return x.e.tank===t.id&&x.overdue;}))messages.push('Feeding two-hour check is overdue.');return messages.length?'<ul>'+messages.map(function(m){return '<li>'+esc(m)+'</li>';}).join('')+'</ul>':'<p class="sub">No additional husbandry alerts.</p>';}
function worldEditVariants(id){var t=tankOf(id),p=worldPopulation(t);openSheet('Recorded variant counts','<p class="sub">One variant per line: name | count | optional #hex colour. Saving records a physical stock count in the existing ledger. Reconcile after stock movements.</p><label class="fld"><span>Variants</span><textarea name="variants" rows="7" required>'+esc(p.variants.map(function(v){return v.name+' | '+(v.count===null?'':v.count)+(v.color?' | '+v.color:'');}).join('\n'))+'</textarea></label>','Save recorded counts',function(fd){var rows=val(fd,'variants').split('\n').filter(function(x){return x.trim();}),out=[];for(var i=0;i<rows.length;i++){var a=rows[i].split('|').map(function(x){return x.trim();});if(!a[0]||a[0].length>60||!/^\d+$/.test(a[1]||'')||!Number.isSafeInteger(+a[1])||(a[2]&&!/^#[0-9a-f]{6}$/i.test(a[2])))return 'Use name | whole-number count | optional #RRGGBB.';if(out.some(function(v){return v.name.toLowerCase()===a[0].toLowerCase();}))return 'Combine duplicate variant names.';out.push({name:a[0],count:+a[1],color:a[2]||''});}if(!out.length||out.length>20)return 'Enter 1–20 variants.';var total=out.reduce(function(n,v){return n+v.count;},0);if(!Number.isSafeInteger(total))return 'Total is too large.';S.ledger.push({id:nid('l'),date:today(),tank:id,kind:'count',qty:total,note:'Tank World variant census'});t.worldVariants=out;t.worldStockSignature=worldSignature(id);commit();});}
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='world-view')setWorldView(b.dataset.mode);if(b.dataset.act==='world-select'||b.dataset.act==='world-open'){UI.tab='world';UI.worldTank=b.dataset.id;render();$('#tw-detail').focus({preventScroll:true});$('#tw-detail').scrollIntoView({behavior:S.settings.worldReduced||window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}if(b.dataset.act==='world-variants')worldEditVariants(b.dataset.id);});
document.addEventListener('change',function(e){var b=e.target;if(b.dataset.set==='worldReduced'){S.settings.worldReduced=b.checked;commit();}if(b.dataset.set==='worldStaleDays'){var n=+b.value;if(Number.isInteger(n)&&n>=1&&n<=365){S.settings.worldStaleDays=n;commit();}}if(b.dataset.worldDecor){tankOf(b.dataset.worldDecor).worldDecor=b.value;commit();}});
window.addEventListener('storage',function(e){if(e.key!==KEY)return;var updated=load();if(!updated)return;S=updated;S.settings=mergeSettings(S.settings);if(!$('#sheet').hidden){closeSheet();toast('Records changed in another tab. Reopen the form to use the updated records.');}render();});
setInterval(function(){if(UI.tab==='world'&&document.visibilityState!=='hidden'&&$('#sheet').hidden)render();},60000);

/* ---------- boot ---------- */
S=load();
if(S){S.settings=mergeSettings(S.settings);S.meta=Object.assign({sample:false,schema:2},S.meta||{});S.officers=Array.isArray(S.officers)?S.officers:[];S.roster=S.roster||{};S.tasks=Array.isArray(S.tasks)?S.tasks:[];S.lockedWeeks=S.lockedWeeks||{};}
else{buildSample();save();}
initializeTankRates();registeredOfficers();save();
var h=(location.hash||'').replace('#','');if(VIEWS[h])UI.tab=h;
render();
})();
</script>
</body>
</html>
