<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HORIBA development checks</title><style>body{font:16px system-ui;margin:20px;background:#ebf5ee;color:#1d3557}button,input{font:inherit;padding:10px;margin:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere}iframe{display:block;width:390px;max-width:100%;height:760px;border:1px solid #1d3557}</style><h1>HORIBA development checks</h1><p>This local QA page does not save photos or readings.</p><label>Select test photo <input type="file" id="photo" accept="image/jpeg,image/png"></label><button id="run">Run worker check</button><button id="stop">Cancel worker</button><pre id="report" aria-live="polite">Ready</pre><h2>390 px form preview</h2><iframe src="../index.html" title="Mobile width NOVERA form"></iframe><script>
let worker=null,token=0,started=0,timer=null,canvas=null;const report=document.querySelector('#report');
const storage=()=>JSON.stringify(Object.keys(localStorage).sort().map(k=>[k,localStorage.getItem(k)]));
const databases=async()=>indexedDB.databases?JSON.stringify(await indexedDB.databases()):'unavailable';
function clean(){if(timer)clearTimeout(timer);timer=null;if(worker)worker.terminate();worker=null;if(canvas)canvas.width=canvas.height=1;canvas=null;document.querySelector('#photo').value='';}
document.querySelector('#stop').onclick=()=>{token++;clean();report.textContent='Cancelled. Active workers: 0; temporary canvas released.';};
document.querySelector('#run').onclick=async()=>{const file=document.querySelector('#photo').files[0];if(!file){report.textContent='Choose a photo.';return;}token++;const id=token;clean();started=performance.now();const before=storage(),dbBefore=await databases();let bitmap;
try{bitmap=await createImageBitmap(file,{imageOrientation:'from-image'});if(id!==token){bitmap.close();return;}const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height));canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const input=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height);worker=new Worker('../assets/horiba-worker.js');timer=setTimeout(()=>{token++;clean();report.textContent='Timed out; worker terminated.';},120000);
worker.onerror=()=>{if(id===token){clean();report.textContent='Worker failed; resources released.';}};
worker.onmessage=async({data})=>{if(id!==token)return;if(data.type==='progress')report.textContent=data.message;if(data.type==='result'||data.type==='error'){clean();report.textContent=JSON.stringify({status:data.type,message:data.message,elapsedMs:Math.round(performance.now()-started),activeWorkers:0,localStorageUnchanged:before===storage(),indexedDBUnchanged:dbBefore===await databases(),readings:data.result?.readings.map(r=>({parameter:r.key,value:r.value})),assetRequests:data.metrics?.assetRequests},null,2);}};
worker.postMessage({type:'scan',image:input},[input.data.buffer]);}catch(e){bitmap?.close();clean();report.textContent=e.message;}};
</script></html>
